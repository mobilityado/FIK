<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b21b6">
  <meta name="description" content="Asistente de consulta de factores PP y PK por corrida.">
  <title>Asistente PP / PK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora aurora-one"></div><div class="aurora aurora-two"></div>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">PP</div>
        <div><h1>Asistente PP / PK</h1><p>Consulta estimada por corrida</p></div>
      </div>
      <button id="restartBtn" class="icon-btn" title="Reiniciar consulta" aria-label="Reiniciar consulta">↻</button>
    </header>

    <section class="chat-card">
      <div id="chat" class="chat" aria-live="polite"></div>
      <div id="quickActions" class="quick-actions"></div>
      <form id="inputForm" class="composer" autocomplete="off">
        <input id="messageInput" inputmode="numeric" placeholder="Escribe tu clave de empleado" aria-label="Mensaje">
        <button id="sendBtn" type="submit">Enviar</button>
      </form>
    </section>

    <footer>Consulta informativa · El cálculo final depende de kilómetros, impuestos y descuentos aplicables.</footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
